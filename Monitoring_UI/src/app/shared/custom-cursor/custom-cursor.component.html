<!-- JARVIS reticle cursor:
       - outer positioned ring (GSAP-controlled) contains a rotating inner
         rotator with tick segments + brackets + dashed inner ring
       - four crosshair blades (top/bottom/left/right)
       - central pulse dot that snaps to the pointer -->
<div #ring class="cursor-ring" aria-hidden="true">
  <div class="ring-rotator">
    <span class="ring-tick t1"></span>
    <span class="ring-tick t2"></span>
    <span class="ring-tick t3"></span>
    <span class="ring-tick t4"></span>
    <span class="ring-tick t5"></span>
    <span class="ring-tick t6"></span>
    <span class="ring-tick t7"></span>
    <span class="ring-tick t8"></span>
    <span class="ring-inner"></span>
  </div>
  <span class="ring-bracket tl"></span>
  <span class="ring-bracket tr"></span>
  <span class="ring-bracket bl"></span>
  <span class="ring-bracket br"></span>
</div>
<div #blades class="cursor-blades" aria-hidden="true">
  <span class="blade top"></span>
  <span class="blade bottom"></span>
  <span class="blade left"></span>
  <span class="blade right"></span>
</div>
<div #dot class="cursor-dot" aria-hidden="true"></div>
