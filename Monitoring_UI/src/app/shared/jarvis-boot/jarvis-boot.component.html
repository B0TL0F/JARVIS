<div class="boot" *ngIf="visible" [class.fading]="fading" role="status" aria-label="Jarvis is initializing">
  <div class="rings">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core"></div>
  </div>

  <div class="wordmark">J&nbsp;A&nbsp;R&nbsp;V&nbsp;I&nbsp;S</div>

  <div class="log">
    <div class="line done" *ngFor="let l of displayedLines">{{ l }}</div>
    <div class="line typing" *ngIf="currentLine">{{ currentLine }}<span class="caret"></span></div>
  </div>
</div>
