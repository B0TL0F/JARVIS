<div class="admin card card-main">
  <div class="main-head">
    <h2>Users</h2>
    <form class="add-form" (ngSubmit)="add()">
      <input type="text" name="u" placeholder="Username" [(ngModel)]="newUsername" autocomplete="off" />
      <input type="password" name="p" placeholder="Password" [(ngModel)]="newPassword" autocomplete="new-password" />
      <select name="r" [(ngModel)]="newRole">
        <option value="developer">developer</option>
        <option value="admin">admin</option>
      </select>
      <button type="submit" class="header-btn primary" [disabled]="submitting">{{ submitting ? 'Adding…' : 'Add user' }}</button>
    </form>
  </div>

  <div class="banner err" *ngIf="error">{{ error }}</div>

  <div class="skeleton-list" *ngIf="loading">
    <div class="skel skel-row" *ngFor="let i of [0,1,2]" [style.animation-delay.ms]="i * 60"></div>
  </div>

  <table class="grid" *ngIf="!loading">
    <thead>
      <tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr>
    </thead>
    <tbody>
      <tr class="jv-stagger" *ngFor="let u of users; let i = index; trackBy: trackById" [style.animation-delay.ms]="i * 30">
        <td>{{ u.username }}</td>
        <td><span class="role chip" [ngClass]="u.role">{{ u.role }}</span></td>
        <td>{{ u.createdAtUtc | date: 'MMM d, y HH:mm':'+0530' }}</td>
        <td class="right"><button class="del header-btn" (click)="remove(u)">Delete</button></td>
      </tr>
      <tr *ngIf="!users.length"><td colspan="4" class="muted">No users.</td></tr>
    </tbody>
  </table>
</div>
